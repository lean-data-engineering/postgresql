services:
  postgres:
    image: postgres:15.1-alpine
    restart: unless-stopped
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgres/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    networks:
      - backend
    ports:
      - 5433:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - backend
    

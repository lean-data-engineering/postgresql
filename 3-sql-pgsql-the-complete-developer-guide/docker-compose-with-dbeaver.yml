  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/clouldbeaver/workspace
    # Useful for connecting to local databases outside of Docker (Mac/Windows)
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pgsql

volumes:
  pgdata:
    external: true
  pg:
    external: true
  cloudbeaver_data:
    external: true
networks:
  backend:
  
# sql query execution order 
# from/join ->  where -> group by -> having -> select -> distinct -> order by -> limit/offset
# so you can't use computed column in select as condition in where clause as it is calcuted after wehere clause.
# but you can use computed column in order by because its executed after select caluse.


# scalar / row-level function -> it applies to each row data and generates one output for that.
# aggregate functions -> rows are collpased to generate summary values. you can't get individual rows.
# window function -> they work on group of rows and instead of collapsing rows they append the data after each row.
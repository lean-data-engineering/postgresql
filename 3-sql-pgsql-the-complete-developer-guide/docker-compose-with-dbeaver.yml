services:
  pgsql:
    image: postgres:15.1-alpine
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    networks: 
      - backend
    ports:
      - 5432:5432

# server name - CloudBeaver Community , login- cbadmin, password - Password1 
